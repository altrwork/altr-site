<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>spARK Labs Impact Study Share Card</title>
<style>
  @font-face {
    font-family: "Space Grotesk";
    src: url("fonts/SpaceGrotesk-VariableFont_wght.ttf") format("truetype");
    font-weight: 300 700;
  }
  @font-face {
    font-family: "Lora";
    src: url("fonts/Lora-Italic-VariableFont_wght.ttf") format("truetype");
    font-style: italic;
    font-weight: 400 700;
  }

  :root {
    --bg: #f4f1eb;
    --ink: #403a33;
    --muted: #8e8172;
    --on-ink-dim: rgba(244, 241, 235, 0.56);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html,
  body {
    width: 1200px;
    height: 627px;
    overflow: hidden;
    background: var(--bg);
  }

  .card {
    position: relative;
    width: 1200px;
    height: 627px;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: "Space Grotesk", Arial, sans-serif;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(64, 58, 51, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64, 58, 51, 0.045) 1px, transparent 1px);
    background-size: 48px 48px;
    -webkit-mask-image: linear-gradient(160deg, #000 50%, rgba(0, 0, 0, 0.35) 100%);
    mask-image: linear-gradient(160deg, #000 50%, rgba(0, 0, 0, 0.35) 100%);
  }

  .card::after {
    content: "";
    position: absolute;
    top: -220px;
    right: -160px;
    width: 680px;
    height: 680px;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 62%);
  }

  .inner {
    position: absolute;
    inset: 0;
    z-index: 2;
    padding: 84px;
  }

  .kicker {
    display: flex;
    gap: 14px;
    align-items: center;
    color: var(--muted);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  .kicker .tick {
    display: inline-block;
    width: 26px;
    height: 2px;
    background: var(--muted);
  }

  .headline {
    position: absolute;
    top: 232px;
    left: 84px;
    width: 660px;
    color: var(--ink);
    font-size: 62px;
    font-weight: 700;
    line-height: 1;
    text-wrap: balance;
  }

  .lede {
    position: absolute;
    top: 486px;
    left: 86px;
    width: 560px;
    color: var(--muted);
    font-family: "Lora", Georgia, serif;
    font-size: 22px;
    font-style: italic;
    line-height: 1.5;
  }

  .panel {
    position: absolute;
    z-index: 2;
    top: 118px;
    right: 84px;
    display: flex;
    width: 316px;
    height: 344px;
    flex-direction: column;
    padding: 30px 30px 34px;
    border-radius: 16px;
    background: var(--ink);
    box-shadow: 0 26px 70px rgba(64, 58, 51, 0.26);
  }

  .panel .plabel {
    color: var(--on-ink-dim);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }

  .panel .logowrap {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
  }

  .panel .logowrap img {
    display: block;
    width: 226px;
    height: auto;
  }

  .keycap {
    position: absolute;
    z-index: 3;
    right: 76px;
    bottom: 52px;
    width: 86px;
    height: auto;
    filter: drop-shadow(0 12px 16px rgba(64, 58, 51, 0.24));
  }

  .url {
    position: absolute;
    bottom: 70px;
    left: 86px;
    color: var(--muted);
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="inner">
    <div class="kicker"><span class="tick"></span>AI Enablement / Impact Study</div>
  </div>

  <h1 class="headline">Automating expenses and event requests with Claude Cowork.</h1>
  <p class="lede">spARK Labs AI Enablement Impact Study</p>

  <div class="panel">
    <div class="plabel">Client</div>
    <div class="logowrap"><img src="spark-labs-logo-dark.svg" alt="spARK Labs" /></div>
  </div>

  <img class="keycap" src="altr_key_logo_cream_taupe_transparent.png" alt="altr" />
  <div class="url">altrwork.com</div>
</div>
</body>
</html>
