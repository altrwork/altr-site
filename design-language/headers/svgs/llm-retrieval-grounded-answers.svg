<!-- title: How RAG works -->
<!-- concept: a question goes to a search over a stack of documents, a magnifier picks out two highlighted passages, and dotted threads tie those passages to cited lines in the answer -->
<!-- question -->
<rect class="f1" x="90" y="250" width="210" height="140" rx="24"/>
<path class="f1" d="M130 388 L118 440 L178 388 Z"/>
<circle class="f4" cx="140" cy="296" r="24"/>
<text class="lbl-in" x="140" y="305" text-anchor="middle">?</text>
<rect class="f3" x="180" y="288" width="92" height="14" rx="7"/>
<rect class="f3" x="118" y="340" width="154" height="14" rx="7"/>
<text class="lbl" x="100" y="500">Question</text>
<path class="acc" d="M310 320 L372 320"/>
<polygon class="f4" points="372,307 396,320 372,333"/>
<!-- document stack -->
<rect class="f1" x="440" y="205" width="200" height="270" rx="8"/>
<rect class="f1" x="420" y="220" width="200" height="270" rx="8"/>
<rect class="f1" x="400" y="235" width="200" height="270" rx="8"/>
<rect class="f3" x="425" y="266" width="150" height="12" rx="6"/>
<rect class="f3" x="425" y="296" width="120" height="12" rx="6"/>
<rect class="f4" x="425" y="330" width="150" height="12" rx="6"/>
<rect class="f4" x="425" y="360" width="130" height="12" rx="6"/>
<rect class="f3" x="425" y="394" width="150" height="12" rx="6"/>
<rect class="f3" x="425" y="424" width="100" height="12" rx="6"/>
<rect class="f3" x="425" y="454" width="140" height="12" rx="6"/>
<!-- magnifier over the passages -->
<circle class="ln" cx="545" cy="350" r="62"/>
<polygon class="f3" points="585,398 597,386 662,451 650,463"/>
<text class="lbl" x="440" y="565">Search</text>
<!-- citation threads -->
<path class="dash" d="M580 336 C680 330 720 312 806 312"/>
<path class="dash" d="M560 366 C680 380 720 402 806 402"/>
<!-- grounded answer -->
<rect class="f1" x="790" y="240" width="280" height="230" rx="16"/>
<rect class="f2" x="815" y="270" width="140" height="14" rx="7"/>
<rect class="f4" x="812" y="302" width="28" height="20" rx="5"/>
<rect class="f3" x="852" y="305" width="180" height="14" rx="7"/>
<rect class="f3" x="815" y="345" width="210" height="14" rx="7"/>
<rect class="f4" x="812" y="392" width="28" height="20" rx="5"/>
<rect class="f3" x="852" y="395" width="150" height="14" rx="7"/>
<rect class="f3" x="815" y="432" width="120" height="14" rx="7"/>
<text class="lbl" x="870" y="530">Answer</text>
