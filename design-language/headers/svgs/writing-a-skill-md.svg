<rect class="f4" x="372" y="268" width="270" height="16" rx="8"/>
<rect class="f4" x="372" y="296" width="200" height="16" rx="8"/>
<!-- body steps -->
<circle class="f2" cx="372" cy="375" r="11"/>
<path class="ln" d="M395 375 L610 375"/>
<circle class="f2" cx="372" cy="418" r="11"/>
<path class="ln" d="M395 418 L570 418"/>
<circle class="f2" cx="372" cy="461" r="11"/>
<path class="ln" d="M395 461 L640 461"/>
<circle class="f2" cx="372" cy="504" r="11"/>
<path class="ln" d="M395 504 L540 504"/>
<!-- annotations -->
<text class="lbl" x="150" y="250">Name</text>
<path class="dash" d="M235 241 L365 241"/>
