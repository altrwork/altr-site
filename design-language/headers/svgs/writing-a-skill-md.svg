<!-- title: How to write a SKILL.md -->
<!-- concept: an annotated SKILL.md sheet: a name and a copper description in the frontmatter that a request matches, numbered steps in the body, and longer references split into linked files -->
<!-- the sheet -->
<rect class="f1" x="330" y="195" width="360" height="370" rx="10"/>
<rect class="f3" x="352" y="215" width="316" height="118" rx="8"/>
