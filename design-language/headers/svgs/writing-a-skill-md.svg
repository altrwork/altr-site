<path class="dash" d="M240 288 L365 288"/>
<text class="lbl" x="150" y="448">Steps</text>
<path class="dash" d="M240 440 L355 440"/>
<!-- a request matching the description -->
<path class="f1" d="M840 205 L1060 205 Q1075 205 1075 220 L1075 262 Q1075 277 1060 277 L1010 277 L1030 298 L985 277 L840 277 Q825 277 825 262 L825 220 Q825 205 840 205 Z"/>
