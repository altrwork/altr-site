<!-- title: AI in CRE underwriting -->
<!-- concept: on one side AI funnels the T-12 and rent roll into a clean spreadsheet; across the line, the approval stamp on the deal stays in human hands -->
<!-- inputs -->
<rect class="f1" x="250" y="192" width="130" height="80" rx="6"/>
<text class="lbl" x="272" y="242">T-12</text>
<rect class="f1" x="400" y="204" width="200" height="80" rx="6"/>
<text class="lbl" x="415" y="254">Rent roll</text>
<!-- funnel -->
<polygon class="f2" points="230,298 620,298 455,398 395,398"/>
<rect class="f2" x="400" y="396" width="50" height="22"/>
<polygon class="f4" points="413,420 437,420 425,436"/>
<!-- spreadsheet -->
<rect class="f1" x="300" y="442" width="250" height="138" rx="6"/>
<rect class="f3" x="300" y="442" width="250" height="30" rx="6"/>
<path class="ln" d="M300 506 L550 506"/>
<path class="ln" d="M300 540 L550 540"/>
<path class="ln" d="M383 472 L383 580"/>
<path class="ln" d="M466 472 L466 580"/>
<rect class="f2" x="395" y="483" width="58" height="12" rx="6"/>
<rect class="f2" x="478" y="517" width="58" height="12" rx="6"/>
<text class="lbl" x="90" y="365">AI prep</text>
<!-- divider -->
<path class="dash" d="M690 195 L690 585"/>
<!-- stamp and memo -->
<rect class="f1" x="790" y="390" width="230" height="160" rx="6"/>
<path class="ln" d="M815 420 L990 420"/>
<path class="ln" d="M815 448 L960 448"/>
<rect class="ln" x="840" y="472" width="130" height="52" rx="6"/>
<path class="acc" d="M870 498 L895 515 L940 482"/>
<circle class="f3" cx="905" cy="222" r="26"/>
<rect class="f3" x="890" y="246" width="30" height="62"/>
<rect class="f4" x="835" y="306" width="140" height="40" rx="6"/>
<path class="dash" d="M905 350 L905 380"/>
<text class="lbl" x="815" y="585">You decide</text>
