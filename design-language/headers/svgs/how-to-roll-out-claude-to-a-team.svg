<path class="f3" d="M175 470 Q175 422 210 422 Q245 422 245 470 Z"/>
<circle class="f1" cx="210" cy="394" r="22"/>
<path class="f3" d="M245 470 Q245 422 280 422 Q315 422 315 470 Z"/>
