<rect class="f2" x="140" y="470" width="280" height="90" rx="6"/>
<rect class="f1" x="460" y="380" width="280" height="180" rx="6"/>
<rect class="ln" x="780" y="290" width="280" height="270" rx="6"/>
<!-- the first workflow, shared -->
<rect class="f1" x="180" y="215" width="200" height="85" rx="12"/>
<path class="ln" d="M234 257 L266 257"/>
<path class="ln" d="M294 257 L326 257"/>
