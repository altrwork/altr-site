<rect class="f1" x="576" y="316" width="16" height="16"/>
<rect class="f1" x="552" y="342" width="16" height="16"/>
<rect class="f1" x="576" y="342" width="16" height="16"/>
<rect class="f3" x="620" y="310" width="190" height="14" rx="7"/>
<rect class="f3" x="620" y="336" width="140" height="14" rx="7"/>
<rect class="f4" x="620" y="362" width="96" height="14" rx="7"/>
<!-- server -->
