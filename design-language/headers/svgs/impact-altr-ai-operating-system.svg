<!-- title: One login, three systems -->
<!-- concept: a person signs in once with a key and reaches three stacked systems (chat, docs, CRM); four named agents reach the same three systems from the other side, but only through a copper gate marked limits -->
<!-- people: head and shoulders -->
<circle class="f1" cx="150" cy="335" r="40"/>
<path class="f2" d="M82 475 Q82 400 150 400 Q218 400 218 475 Z"/>
<path class="ln" d="M126 332 Q150 350 174 332"/>
<text class="lbl" x="150" y="545" text-anchor="middle">People</text>
<!-- the login key -->
<rect class="f4" x="262" y="350" width="82" height="66" rx="14"/>
<rect class="f1" x="274" y="362" width="58" height="42" rx="9"/>
<text class="lbl" x="303" y="392" text-anchor="middle">altr</text>
<text class="lbl" x="303" y="465" text-anchor="middle">One login</text>
<!-- key to systems -->
<path class="acc" d="M352 383 L412 383"/>
