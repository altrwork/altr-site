<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>uncreated — resources</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1c1c1a;
    --ink-2: #4a4a47;
    --ink-3: #8a8a85;
    --paper: #f6f3ec;
    --paper-2: #ece7d9;
    --hi: #ffec8a;
    --hand: "Kalam", cursive;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--hand);
    min-height: 100vh;
    display: flex; flex-direction: column;
    background-image:
      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,0.02) 1px, transparent 1px);
    background-size: 5px 5px, 11px 11px;
    background-position: 0 0, 2px 3px;
  }
  .ribbon {
    position: sticky; top: 0; z-index: 50;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
    padding: 14px 32px 12px;
    display: flex; align-items: center; gap: 28px;
  }
  .logo {
    font-family: var(--hand); font-weight: 700; font-size: 24px;
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--ink);
  }
  .logo .dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--ink); background: var(--hi);
    transform: rotate(-6deg);
  }
  .ribbon nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .ribbon nav a {
    font-family: var(--hand); font-size: 17px; color: var(--ink-2);
    padding: 6px 14px 7px; text-decoration: none;
    border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
    border: 2px solid transparent;
    transition: color 0.12s, background-color 0.12s, border-color 0.12s;
  }
  .ribbon nav a:hover { color: var(--ink); }
  .ribbon nav a[aria-current="page"] {
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .ribbon nav a.cta {
    border: 2px solid var(--ink); color: var(--ink); margin-left: 8px;
  }
  .ribbon nav a.cta:hover { background: var(--ink); color: var(--paper); }

  main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 64px 32px;
  }
  .placeholder {
    max-width: 560px;
    text-align: center;
    border: 2.5px dashed var(--ink);
    border-radius: 18px 24px 16px 26px;
    padding: 56px 40px;
    background: #fffdf6;
    box-shadow: 6px 6px 0 -2px var(--ink);
  }
  .placeholder .kicker {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-2);
    margin-bottom: 14px;
  }
  .placeholder h1 {
    font-family: var(--hand);
    font-weight: 700;
    font-size: 56px;
    margin: 0 0 12px;
    line-height: 1;
  }
  .placeholder h1 .hl { background: var(--hi); padding: 0 8px; }
  .placeholder p {
    font-family: var(--hand);
    font-size: 18px;
    color: var(--ink-2);
    margin: 0 0 24px;
    line-height: 1.4;
  }
  .placeholder a.back {
    display: inline-block;
    background: var(--ink); color: var(--paper);
    border: 2px solid var(--ink);
    padding: 10px 22px;
    font-family: var(--hand); font-size: 17px;
    border-radius: 22px 24px 20px 26px;
    text-decoration: none;
  }
  .placeholder .scratch {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    margin-top: 18px;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<header class="ribbon">
  <a class="logo" href="index.html"><span class="dot"></span>uncreated</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="resources.html" aria-current="page">Resources</a>
    <a href="index.html#contact" class="cta">Get in touch →</a>
  </nav>
</header>

<main>
  <div class="placeholder">
    <div class="kicker">§ resources · placeholder</div>
    <h1>writing <span class="hl">soon</span>.</h1>
    <p>Essays, case studies, and field notes will live here. We're still drafting.</p>
    <a class="back" href="index.html">← Back home</a>
    <div class="scratch">to-do: essays · case studies · open source · talks</div>
  </div>
</main>
</body>
</html>
