name: IndexNow

# Netlify deploys every push to main. First date the changed pages in
# sitemap.xml, which is the signal Google reads (it ignores IndexNow), and
# commit that back. Then, once the deploy has had time to go live, tell
# IndexNow which listed pages changed so Bing recrawls them without waiting.
# The sitemap commit is pushed with GITHUB_TOKEN, which never re-triggers
# workflows, so this cannot loop.
on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Find the commit before this push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A manual run, a new branch or a force push has no usable "before".
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD~1)
          fi
          echo "BEFORE=$BEFORE" >> "$GITHUB_ENV"

      - name: Date changed pages in sitemap.xml
        run: |
          python .github/indexnow.py --stamp-lastmod "$BEFORE"
          if git diff --quiet -- sitemap.xml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sitemap: date pages changed in ${GITHUB_SHA::7}" -- sitemap.xml
          # someone may have pushed meanwhile; replay the one-file change on top
          git pull --rebase origin main && git push origin HEAD:main

      - name: Wait for the Netlify deploy
        run: sleep 120

      - name: Submit changed pages
        run: python .github/indexnow.py --changed-since "$BEFORE"
